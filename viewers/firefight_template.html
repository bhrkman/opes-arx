<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Firefight — Opes Arx: The Capital Divide</title>
<style>
  :root{
    --ink:#e9e4dc; --dim:#9a9187; --faint:#6b635a;
    --bg:#14120f; --panel:#1c1916; --edge:#2e2823;
    --violet:#9d7cd8; --gold:#d8a657; --red:#d16a5e; --green:#89b482;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.55 ui-monospace,"SF Mono",Menlo,Consolas,monospace;padding:28px 20px 70px}
  .wrap{max-width:1240px;margin:0 auto}
  h1{font-size:22px;margin:0 0 4px;letter-spacing:.02em}
  h1 .sub{color:var(--violet)}
  .lede{color:var(--dim);max-width:82ch;margin:0 0 22px;font-size:13.5px}
  .lede b{color:var(--ink);font-weight:600}
  code{color:var(--dim);font-size:12px}
  .panel{background:var(--panel);border:1px solid var(--edge);border-radius:5px;
         padding:16px 18px;margin:0 0 18px}
  .panel h2{font-size:13px;margin:0 0 3px;letter-spacing:.09em;text-transform:uppercase;color:var(--gold)}
  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
  /* SETUP is scaffolding and reads that way; VIEW is the part a commander would touch. */
  .grp{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);
       border-left:2px solid var(--line);padding-left:8px;margin-left:4px}
  .grp:first-child{margin-left:0;border-left:none;padding-left:0}
  label{color:var(--dim);font-size:12.5px}
  select,button,input{font:inherit;font-size:13px;background:#241f1b;color:var(--ink);
                border:1px solid var(--edge);border-radius:4px;padding:6px 11px}
  button{cursor:pointer;border-color:#43392f}
  button:hover{background:#2e2721;border-color:var(--violet)}
  button.go{border-color:var(--violet);color:#cbb4ef}
  .cols{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
  @media(max-width:1040px){.cols{grid-template-columns:1fr}}
  canvas{display:block;width:100%;height:auto;background:#100e0c;
         border:1px solid var(--edge);border-radius:4px}
  input[type=range]{width:100%;padding:0;background:none;border:none}
  .scrub{display:flex;gap:12px;align-items:center;margin-top:10px}
  .scrub .t{color:var(--gold);white-space:nowrap;font-size:13px}
  .ev{font-size:12px;color:var(--dim);margin:2px 0}
  .ev.arrive{color:var(--gold);font-weight:600}
  .ev.hit{color:#d9a49c} .ev.down{color:var(--red)}
  .evbox{max-height:340px;overflow:auto}
  .legend{color:var(--faint);font-size:11.5px;margin-top:10px;line-height:1.85}
  .legend i{font-style:normal;color:var(--dim)}
  .foot{color:var(--faint);font-size:12px;margin-top:10px}
  table{border-collapse:collapse;width:100%;font-size:12.5px}
  th,td{text-align:left;padding:4px 8px 4px 0}
  th{color:var(--faint);font-weight:400;border-bottom:1px solid var(--edge);
     font-size:11px;letter-spacing:.07em;text-transform:uppercase}
  .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:7px}
</style>
</head>
<body>
<div class="wrap">

<h1>The Firefight</h1>

<div class="panel">
  <div class="controls">
    <!-- SETUP is scaffolding: until a season feeds engagements in, a fight has to be
         conjured from somewhere. These are not things a player will ever set. -->
    <span class="grp">setup</span>
    <input id="seed" value="fight-1" size="8" title="seed">
    <select id="terrain">
      <option>ruins</option><option>broken_ground</option><option>open_basin</option>
      <option>forest</option><option>entrenched</option>
    </select>
    <select id="band">
      <option value="0">met at long range</option>
      <option value="1" selected>met at medium range</option>
      <option value="2">met at close range</option>
    </select>
    <select id="join">
      <option value="0">no third squad</option>
      <option value="3">a third squad on turn 3</option>
      <option value="6" selected>a third squad on turn 6</option>
      <option value="10">a third squad on turn 10</option>
    </select>
    <select id="bearing">
      <option value="3.14159">arriving behind the defenders</option>
      <option value="1.5708">arriving from the south</option>
      <option value="0">arriving alongside the attackers</option>
    </select>
    <label><input type="checkbox" id="flanked"> defenders caught from two arcs</label>
    <button id="run" class="go">fight it</button>

    <!-- VIEW is the part that survives into the game. A commander sees what their own side has
         found, not the field as it really is. -->
    <span class="grp">view</span>
    <label><input type="checkbox" id="noanim"> no movement</label>
    <button id="play">play</button>
  </div>

  <div class="cols">
    <div>
      <canvas id="grid" width="1300" height="900"></canvas>
      <div class="scrub">
        <button id="back">&lsaquo;</button>
        <input id="fr" type="range" min="0" max="0" value="0">
        <button id="fwd">&rsaquo;</button>
        <span class="t" id="frLbl">turn 1</span>
      </div>
      <div class="foot" id="cost"></div>
    </div>

    <div>
      <div class="panel" style="margin:0 0 12px;padding:13px 15px">
        <h2>the sides</h2>
        <table id="sides"></table>
      </div>
      <div class="panel" style="margin:0;padding:13px 15px">
        <h2>what happened</h2>
        <div class="evbox" id="events"></div>
      </div>
    </div>
  </div>
</div>

</div>

<script>
/*__DATA__*/
</script>
<script>
/*__SIM__*/
</script>
<script>
(function () {
  'use strict';
  var P = window.CDPRNG, ROSTER = window.CDROSTER, ITEMS = window.CDITEMS,
      C = window.CDCOMBAT, TAC = window.CDTACTICAL;

  var A = window.ARX_DATA;
  ITEMS.init(A.items);
  ROSTER.initRoster({ races: A.races, traits: A.traits,
                      recruitment: A.recruitment, oa: A.oa_profiles });

  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s).replace(/[&<>]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); };

  var SIDE = ['#d8a657', '#7fb0c8', '#89b482'];
  var NAME = ['the attackers', 'the defenders', 'the squad that walked in'];
  var G = { res: null, i: 0, timer: null, arriveTurn: 0 };

  function makeSide(seed, tag, n) {
    var b = ROSTER.generateSquad(P.mulberry32(P.seedFrom(seed)), n, { corpId: tag }).bodies;
    /* KIT IS ALWAYS WHAT A CORPORATION BUYS. The uniform-carbine option is gone: it existed to
       show what the demo used to do wrong, and a field with no machine guns in it has no place
       in something meant to look like the game. `planForce` is the call `divide.js` makes. */
    var oaList = (A.oa_profiles && A.oa_profiles.oa_profiles) || A.oa_profiles || null;
    var prof = oaList ? oaList[(tag === 'A' ? 1 : tag === 'B' ? 4 : 2) % oaList.length] : null;
    var doc = prof && ITEMS.doctrineForCorp(prof.id);
    var plan = doc && ITEMS.planForce(doc.id, b.length, { season: 1, budget: 1e9 });
    if (plan && plan.bodies && plan.bodies.length) {
      for (var bi = 0; bi < b.length; bi++) {
        ITEMS.equip(b[bi], plan.bodies[bi % plan.bodies.length].loadout);
      }
    } else {
      ITEMS.equipForce(b, ITEMS.DEFAULT_LOADOUT);   /* never silently field nothing */
    }
    return { tag: tag, corpId: tag, policy: 'standard', policyName: 'standard', hasMedkit: true,
             units: b.map(function (f) {
               return C.makeCombatant(f, { traitIndex: ROSTER.traitById, day: 1 }); }) };
  }

  function run() {
    var seed = $('seed').value || 'fight-1';
    var joinTurn = parseInt($('join').value, 10);
    var bearing = parseFloat($('bearing').value);
    G.arriveTurn = joinTurn;

    var a = makeSide(seed + '-a', 'A', 6);
    var b = makeSide(seed + '-b', 'B', 6);
    var ctx = { terrain: $('terrain').value,
                openingBand: parseInt($('band').value, 10), prep: [0.5, 0.5],
                flanked: [false, !!$('flanked').checked] };
    if (joinTurn > 0) {
      /* THE SAME SHAPE `divide.js` BUILDS during a contest: a side, the turn it walks in on,
         and the bearing it approached from. Nothing here is a mock of the real thing. */
      ctx.reinforce = [{ side: makeSide(seed + '-c', 'C', 5), atTurn: joinTurn,
                         bearing: bearing, prep: 0.5 }];
      ctx.forceBearings = true;
      ctx.bearings = [0, Math.PI];
    }
    var t0 = (window.performance || Date).now();
    G.res = TAC.resolve(P.mulberry32(P.seedFrom(seed)), a, b, ctx);
    var ms = Math.round((window.performance || Date).now() - t0);
    $('fr').max = String(Math.max(0, G.res.frames.length - 1));
    $('fr').value = '0'; G.i = 0;
    $('cost').textContent = G.res.frames.length + ' frames over ' + G.res.turns +
      ' turns in ' + ms + ' ms \u00b7 ' + G.res.result +
      (G.res.telemetry.arrivals ? ' \u00b7 ' + G.res.telemetry.arrived + ' walked in' : '') +
      ' \u00b7 ' + (G.res.telemetry.flankShots || 0) + ' shots round the side' +
      ' \u00b7 ' + (G.res.telemetry.pins || 0) + ' pinned' +
      ((G.res.telemetry.energyShots || 0) ? ' \u00b7 ' + G.res.telemetry.energyShots + ' energy shots' : '') +
      (G.res.telemetry.fogOn
        ? ' \u00b7 first contact turn ' + (G.res.telemetry.contactTurn || '\u2014') +
          ' \u00b7 ' + (G.res.telemetry.blindShots || 0) + ' of ' +
          (G.res.telemetry.shots || 0) + ' shots were at a muzzle flash'
        : ' \u00b7 spotting off');
    draw();
  }

  function draw() {
    if (!G.res) return;
    var cv = $('grid'), g = cv.getContext('2d');
    var map = G.res.map, F = G.res.frames[G.i];
    if (!F) return;
    var s = Math.min(cv.width / map.w, cv.height / map.h);
    g.clearRect(0, 0, cv.width, cv.height);

    /* the ground: cover is a grade per tile, and it is what people are hiding behind */
    for (var x = 0; x < map.w; x++) {
      for (var y = 0; y < map.h; y++) {
        /* `tiles` IS ROWS, NOT A FLAT ARRAY: `tiles[y][x]`. Indexed flat, every lookup returned
           a whole row — an object, truthy, never a grade — so the ground painted as one
           uniform sheet and the cover the entire fight is fought around was invisible. */
        var v = (map.tiles[y] || [])[x] || 0;
        g.fillStyle = v > 0 ? 'rgba(157,124,216,' + (0.10 + 0.16 * v) + ')' : '#171410';
        g.fillRect(x * s + 1, y * s + 1, s - 2, s - 2);
      }
    }

    /* POINT OF VIEW. -1 draws the field as it really is. Set to a side and every enemy that
       side has not found is simply not drawn — which is the honest picture of what that squad
       is deciding on, and the only way to see that the gap exists at all. Their own people are
       always drawn: you know where your own squad is. */
    /* THE REPLAY IS ALWAYS THE TRUTH. Ruled: a commander watches this up to two days after the
       fact and has full vision of it; seeing the field through one side's eyes is only of use
       to the bodies standing in it, and that is where fog now lives — in their decisions, not
       in this picture. The concealment MARKINGS stay, because who had been found and who had
       not is exactly what you are watching for. */
    var pov = -1;
    var labels = [];

    /* RACE IS DRAWN FROM PHYSIOLOGY, NOT INVENTED. Every race in `races.json` carries
       physiology tags — olmac "massive, granite_skin", mon_wa "paired_symbiote, small",
       thythyn "winged, light_frame" — so size and colour follow the data rather than a
       preference. A Mon-Wa reads as two small bodies because that is what it IS: the roster
       generates a bonded pair, "one being, two bodies", and each half is its own combatant.
       TEAM COLOUR IS THE RING. Race is the fill, so you can read species and side at once. */
    /* NINE SPECIES BY SIZE AND COLOUR. Silhouettes were tried and taken back out: they read as
       clutter, and worse, they made SIDE hard to see, which is the thing you most need at a
       glance. The shapes were never the fix — the fault was that every fill was a variation on
       the same tan.
       THESE FILLS ARE DELIBERATELY DESATURATED. The side ring is gold, blue or green, all three
       saturated; the first attempt at a palette gave races teal, slate-blue and ochre, which are
       those same three hues, so fill and ring competed and you could no longer tell who was on
       what team. Species is a muted body colour, side is the one saturated thing on the field.
       Size runs in four tiers from massive to small, straight off the physiology tags, and
       within a tier the hues are pushed well apart so the pairs never read as each other. */
    var RACE = {
      olmac:    { r: 0.46, fill: '#6f6f69' },   /* massive, granite_skin — dark stone */
      svalbard: { r: 0.42, fill: '#566b7a' },   /* six_limbed, centauroid — dark slate */
      etu:      { r: 0.38, fill: '#6e8560' },   /* crocodilian, tough_hide — olive */
      attorak:  { r: 0.36, fill: '#8f7256' },   /* hyena_build — brown */
      human:    { r: 0.32, fill: '#bcae96' },   /* baseline — tan */
      kellis:   { r: 0.30, fill: '#a291b5' },   /* insectoid, light_frame — mauve */
      thythyn:  { r: 0.285, fill: '#8fabab' },  /* winged, light_frame — pale grey-teal */
      gil:      { r: 0.26, fill: '#c98a80' },   /* small, agile — muted rose-rust */
      mon_wa:   { r: 0.235, fill: '#f0ece4' }   /* paired_symbiote, small — near white */
    };

    for (var i = 0; i < F.units.length; i++) {
      var u = F.units[i];
      /* MOVEMENT IS DRAWN BETWEEN TILES, not snapped onto them. The per-body frames already
         carried `from` — where that body stood before it acted — and nothing had ever used it,
         so a fighter teleported a full tile at a time and you could not see who had crossed
         what. Only the ACTING body is interpolated: everyone else is exactly where the frame
         says they are, so nothing here invents a position the simulation did not produce. */
      var ux = u.x, uy = u.y;
      if (G.tween && G.tween.id === u.id) {
        ux = G.tween.fx + (u.x - G.tween.fx) * G.tween.a;
        uy = G.tween.fy + (u.y - G.tween.fy) * G.tween.a;
      }
      var cx = ux * s + s / 2, cy = uy * s + s / 2;
      var col = SIDE[u.s % SIDE.length];
      var rc = RACE[u.race] || RACE.human;
      var kn = (u.kn == null) ? 2 : u.kn;      /* 0 hidden · 1 heard · 2 seen */
      if (pov >= 0 && u.s !== pov && kn === 0) continue;
      if (pov >= 0 && u.s !== pov && kn === 1) {
        /* a shot came from about here. Draw the guess, not the man. */
        g.strokeStyle = 'rgba(233,228,220,.30)'; g.lineWidth = 1;
        g.setLineDash([3, 4]);
        g.beginPath(); g.arc(cx, cy, s * 0.52, 0, Math.PI * 2); g.stroke();
        g.setLineDash([]);
        g.fillStyle = 'rgba(233,228,220,.22)';
        g.font = Math.round(s * 0.42) + 'px ui-monospace,monospace';
        g.textAlign = 'center'; g.fillText('?', cx, cy + s * 0.15);
        continue;
      }
      /* in the true view, show what each body's own concealment is worth */
      if (pov < 0 && kn === 0 && (u.st === 'ok' || u.st === 'light')) {
        g.fillStyle = 'rgba(10,8,6,.55)';
        g.beginPath(); g.arc(cx, cy, s * 0.60, 0, Math.PI * 2); g.fill();
        g.strokeStyle = 'rgba(233,228,220,.22)'; g.lineWidth = 1;
        g.setLineDash([2, 3]);
        g.beginPath(); g.arc(cx, cy, s * 0.56, 0, Math.PI * 2); g.stroke();
        g.setLineDash([]);
      } else if (pov < 0 && kn === 1 && (u.st === 'ok' || u.st === 'light')) {
        g.strokeStyle = 'rgba(233,228,220,.34)'; g.lineWidth = 1.5;
        g.setLineDash([4, 4]);
        g.beginPath(); g.arc(cx, cy, s * 0.56, 0, Math.PI * 2); g.stroke();
        g.setLineDash([]);
      }
      /* the arriving squad flashes on the turn it walks in */
      if (u.s === 2 && F.turn === G.arriveTurn) {
        g.fillStyle = 'rgba(216,166,87,.28)';
        g.beginPath(); g.arc(cx, cy, s * 1.5, 0, Math.PI * 2); g.fill();
      }
      /* species is the size and the fill; side is the ring, and the ring is the loud one */
      g.beginPath(); g.arc(cx, cy, s * rc.r, 0, Math.PI * 2);
      if (u.st === 'ok' || u.st === 'light') { g.fillStyle = rc.fill; g.fill(); }
      g.lineWidth = 3; g.strokeStyle = col; g.stroke();
      if (u.st === 'dead') {
        g.strokeStyle = '#d16a5e';
        g.beginPath();
        g.moveTo(cx - s * .22, cy - s * .22); g.lineTo(cx + s * .22, cy + s * .22);
        g.moveTo(cx + s * .22, cy - s * .22); g.lineTo(cx - s * .22, cy + s * .22);
        g.stroke();
      }
      if (u.ow) { g.strokeStyle = '#e9e4dc'; g.lineWidth = 1;
                  g.beginPath(); g.arc(cx, cy, s * (rc.r + 0.14), 0, Math.PI * 2); g.stroke(); }
      /* PINNED. Suppression is true on about a third of every shot evaluation in a real contest
         — the most-used modifier in the game — and until now the replay had no way to show it.
         A pinned body needs a move to beat standing still by eight times the usual margin, so
         these are the people who are about to not move, and that is worth being able to see. */
      /* CAUGHT MID-MOVE. A body that has just crossed ground is easier to hit until its own
         turn comes round — 1.15 for a normal move, 1.30 for a dash. Both were read by the shot
         calculation and written by nothing until this pass, so movement was specified as costly
         and was in fact free. Drawn as a short trail behind the body. */
      if (u.mv && (u.st === 'ok' || u.st === 'light')) {
        g.strokeStyle = u.mv === 2 ? 'rgba(209,106,94,.75)' : 'rgba(216,166,87,.55)';
        g.lineWidth = u.mv === 2 ? 2 : 1.5;
        g.beginPath(); g.arc(cx, cy, s * (rc.r + 0.02), 0.6, 2.6); g.stroke();
      }
      if (u.sup && (u.st === 'ok' || u.st === 'light')) {
        g.strokeStyle = '#d8a657'; g.lineWidth = 2;
        g.beginPath();
        g.moveTo(cx - s * .30, cy + s * .30); g.lineTo(cx + s * .30, cy + s * .30);
        g.stroke();
      }
      if (u.st === 'ok' || u.st === 'light') {
        /* THE WOUND POOL, which is what this pass built. A bar under each body: what is left of
           it, and how much of it this fight has taken. Before the pool a hit either did nothing
           visible or removed somebody, and there was nothing here to draw. */
        if (u.hp != null && u.hpMax) {
          var frac = Math.max(0, u.hp) / u.hpMax;
          var bw = s * 0.72, bx = cx - bw / 2, by = cy + s * 0.34;
          g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(bx, by, bw, s * 0.13);
          g.fillStyle = frac > 0.6 ? '#89b482' : frac > 0.3 ? '#d8a657' : '#d16a5e';
          g.fillRect(bx, by, bw * frac, s * 0.13);
        }
        g.fillStyle = 'rgba(233,228,220,.45)';
        g.font = Math.round(s * 0.28) + 'px ui-monospace,monospace';
        g.textAlign = 'center';
        g.fillText(String(u.comp), cx + s * 0.52, cy - s * 0.30);
        /* THE NAME, WHICH IS THE POINT OF HAVING NAMES. Collected rather than drawn here:
           bodies bunch up, and twelve labels painted blind would overlap into mush exactly
           when the fight is most interesting. Laid out after the field, below. */
        labels.push({ x: cx, y: cy - s * (rc.r + 0.18), text: u.name || '', col: col });
      }
    }
    /* NAME LAYOUT — nudge upward until a label clears the ones already placed. Cheap, stable,
       and it degrades honestly: if a body cannot find room within four steps its name is
       dropped rather than drawn on top of somebody else's. A label you cannot read is worse
       than no label, because it damages the two either side of it as well. */
    g.font = Math.round(s * 0.26) + 'px ui-monospace,monospace';
    g.textAlign = 'center';
    var placed = [];
    for (var L = 0; L < labels.length; L++) {
      var lb = labels[L];
      if (!lb.text) continue;
      var w = g.measureText(lb.text).width + 4, h = s * 0.30, ly = lb.y, ok = false;
      for (var tryN = 0; tryN < 5; tryN++) {
        ok = true;
        for (var q3 = 0; q3 < placed.length; q3++) {
          var pl = placed[q3];
          if (Math.abs(pl.x - lb.x) < (pl.w + w) / 2 && Math.abs(pl.y - ly) < h) { ok = false; break; }
        }
        if (ok) break;
        ly -= h;
      }
      if (!ok) continue;
      placed.push({ x: lb.x, y: ly, w: w });
      g.fillStyle = 'rgba(10,8,6,.72)';
      g.fillRect(lb.x - w / 2, ly - s * 0.22, w, s * 0.28);
      g.fillStyle = lb.col;
      g.fillText(lb.text, lb.x, ly);
    }
    /* PROJECTILES, drawn last so they sit over the bodies. A miss carries past the target and
       fades; a hit stops on it and flashes. Reaction fire is drawn paler, because a shot taken
       on overwatch is somebody else's turn intruding on this one. */
    if (G.fx) {
      for (var fx = 0; fx < G.fx.length; fx++) {
        var sh = G.fx[fx];
        var pr = (G.el - sh.delay) / sh.dur;
        if (pr < 0) continue;
        var ax = sh.ax * s + s / 2, ay = sh.ay * s + s / 2;
        var tx = sh.tx * s + s / 2, ty = sh.ty * s + s / 2;
        if (pr > 1) {
          /* the hit flash, for a few frames after the round lands */
          if (sh.hit && pr < 1.9) {
            g.strokeStyle = 'rgba(233,228,220,' + (1 - (pr - 1) / 0.9).toFixed(2) + ')';
            g.lineWidth = 2;
            g.beginPath(); g.arc(tx, ty, s * (0.30 + (pr - 1) * 0.35), 0, Math.PI * 2); g.stroke();
          }
          continue;
        }
        /* a miss keeps going past them rather than stopping in mid-air */
        var end = sh.hit ? 1 : 1.35;
        var px = ax + (tx - ax) * pr * end, py = ay + (ty - ay) * pr * end;
        var back = Math.max(0, pr - 0.18) * end;
        var qx = ax + (tx - ax) * back, qy = ay + (ty - ay) * back;
        g.strokeStyle = sh.react ? 'rgba(233,228,220,.40)' : 'rgba(255,240,200,.85)';
        g.lineWidth = sh.react ? 1.5 : 2;
        g.beginPath(); g.moveTo(qx, qy); g.lineTo(px, py); g.stroke();
      }
    }

    $('frLbl').textContent = 'turn ' + F.turn + ' of ' + G.res.turns;
    paintSide();
  }

  function paintSide() {
    var F = G.res.frames[G.i];
    var counts = {};
    for (var i = 0; i < F.units.length; i++) {
      var u = F.units[i];
      counts[u.s] = counts[u.s] || { up: 0, down: 0, dead: 0 };
      if (u.st === 'dead') counts[u.s].dead++;
      else if (u.st === 'ok' || u.st === 'light') counts[u.s].up++;
      else counts[u.s].down++;
    }
    var rows = '<tr><th>side</th><th>up</th><th>down</th><th>dead</th></tr>';
    for (var k in counts) {
      rows += '<tr><td><span class="sw" style="background:' + SIDE[k % SIDE.length] + '"></span>' +
        esc(NAME[k] || ('side ' + k)) + '</td><td>' + counts[k].up + '</td><td>' +
        counts[k].down + '</td><td>' + counts[k].dead + '</td></tr>';
    }
    $('sides').innerHTML = rows;

    /* THIS PANEL SAID NOTHING FOR EVERY EVENT IT EVER DREW. It read `v.kind`, `v.text`,
       `v.down` and `v.dead`; the engine writes `type`, `by`, `at` and a payload. None of the
       four fields it looked for exists, so `v.text || v.kind || ''` was always the empty
       string and every line rendered as a turn number followed by nothing. It failed silently
       because an empty string is a perfectly good thing to put in a div. */
    var out = '';
    var nameOf = {};
    for (var q = 0; q < F.units.length; q++) nameOf[F.units[q].id] = F.units[q].name || '?';
    var sideOf = {};
    for (var q2 = 0; q2 < F.units.length; q2++) sideOf[F.units[q2].id] = F.units[q2].s;
    var VERB = { miss: 'misses', hit: 'hits', graze: 'grazes', light: 'wounds',
                 down: 'puts down', killed: 'kills', arrive: 'walks in' };
    for (var e = 0; e < (G.res.log || []).length; e++) {
      var v = G.res.log[e];
      if (v.t > F.turn) break;
      if (v.t < F.turn - 1) continue;
      var cls = v.type === 'killed' || v.type === 'down' ? 'down'
              : v.type === 'miss' ? '' : 'hit';
      var who = nameOf[v.by] || v.by || '?';
      var whom = nameOf[v.at] || v.at || '';
      var verb = VERB[v.type] || v.type || '';
      var tail = '';
      if (v.w) tail += ' \u00b7 ' + esc(v.w);
      if (v.react) tail += ' \u00b7 on overwatch';
      if (v.sev) tail += ' \u00b7 ' + esc(v.sev);
      if (v.type === 'miss' && v.p != null) tail += ' \u00b7 ' + Math.round(v.p * 100) + '% shot';
      var col = SIDE[(sideOf[v.by] || 0) % SIDE.length];
      out += '<div class="ev ' + cls + '">t' + v.t + ' \u00b7 ' +
             '<span style="color:' + col + '">' + esc(who) + '</span> ' + esc(verb) +
             (whom ? ' ' + esc(whom) : '') + tail + '</div>';
    }
    $('events').innerHTML = out || '<div class="ev">nothing yet</div>';
  }

  function stop() { if (G.timer) { clearInterval(G.timer); G.timer = null; $('play').textContent = 'play'; } }
  function clearTween() {
    if (G.tw) { clearInterval(G.tw); G.tw = null; }
    G.tween = null; G.fx = null; G.el = 0;
  }

  /**
   * One projectile per trigger pull, read off the log entries the frame already carries.
   * ROUND COUNT NEEDS NO SPECIAL CASE: a burst weapon writes several `hit`/`miss` entries in one
   * activation and a marksman rifle writes one, so a Belt Machine Gun throws four and a Whisper
   * throws one because that is what happened, not because the viewer was told to. (Until this
   * pass the extra rounds were counted in telemetry and never written to the log, so every
   * weapon looked single-shot in the replay.)
   */
  function buildShots(F, delayBase) {
    if (!F || !F.did || !F.did.length) return null;
    var at = {};
    for (var i = 0; i < F.units.length; i++) at[F.units[i].id] = F.units[i];
    var out = [], n = 0;
    for (var e = 0; e < F.did.length; e++) {
      var v = F.did[e];
      if (v.type !== 'hit' && v.type !== 'miss') continue;
      var a = at[v.by], t = at[v.at];
      if (!a || !t) continue;
      out.push({ ax: a.x, ay: a.y, tx: t.x, ty: t.y, hit: v.type === 'hit',
                 react: !!v.react, delay: delayBase + n * 45, dur: 110 });
      n++;
      if (n > 12) break;                 /* a turn cannot usefully show more than this */
    }
    return out.length ? out : null;
  }

  /**
   * `animate` is opt-in per call, and dragging the slider passes false. A scrub is somebody
   * looking for a moment, not watching a fight, and tweening every frame they drag through
   * would fight the drag and lag behind the handle.
   */
  function goto(i, animate) {
    if (!G.res) return;
    clearTween();
    G.i = Math.max(0, Math.min(G.res.frames.length - 1, i));
    $('fr').value = String(G.i);
    var F = G.res.frames[G.i];
    if (animate && F && !$('noanim').checked) {
      var moving = F.moved && F.from && F.actor != null && F.from.x !== undefined;
      var moveMs = moving ? (G.timer ? 80 : 150) * (F.via ? 1.8 : 1) : 0;  /* two legs need more time */
      var shots = buildShots(F, moveMs);          /* shots start once the body has arrived */
      if (moving || shots) {
        var t0 = Date.now(), last = moveMs;
        if (shots) for (var q = 0; q < shots.length; q++)
          last = Math.max(last, shots[q].delay + shots[q].dur);
        G.tween = moving ? { id: F.actor, fx: F.from.x, fy: F.from.y, a: 0 } : null;
        G.fx = shots; G.el = 0;
        draw();
        G.tw = setInterval(function () {
          G.el = Date.now() - t0;
          if (G.el >= last) { clearTween(); draw(); return; }
          if (G.tween) {
            var a = Math.min(1, G.el / moveMs);
            G.tween.a = 1 - (1 - a) * (1 - a);   /* ease out, so the step lands */
          }
          draw();
        }, 16);
        return;
      }
    }
    draw();
  }

  $('run').onclick = function () { stop(); run(); };
  /* POINT OF VIEW REDRAWS, IT DOES NOT REFIGHT. Switching between what the attackers know and
     what the defenders know has to be the same fight seen twice, or you are comparing two
     different battles and the comparison means nothing. The fight is in `G.res`; this only
     changes what gets painted from it. The band and the spotting switch DO refight, because
     they change the engagement itself. */
  $('band').onchange = function () { stop(); run(); };
  $('noanim').onchange = function () { clearTween(); draw(); };
  $('back').onclick = function () { stop(); goto(G.i - 1, true); };
  $('fwd').onclick = function () { stop(); goto(G.i + 1, true); };
  $('fr').oninput = function () { stop(); goto(parseInt($('fr').value, 10), false); };
  $('play').onclick = function () {
    if (G.timer) return stop();
    if (G.i >= G.res.frames.length - 1) goto(0);
    $('play').textContent = 'pause';
    G.timer = setInterval(function () {
      if (G.i >= G.res.frames.length - 1) return stop();
      goto(G.i + 1, true);
    }, 110);
  };

  run();
}());
</script>
</body>
</html>
